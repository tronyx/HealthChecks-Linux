# HealthChecks Linux configuration
#
# Copy this file to healthchecks.toml, next to healthchecks_linux.py or in
# ~/.config/healthchecks-linux/, and edit the copy. For each check that you
# want to run, set uuid to the UUID of its Healthchecks check, and set
# enabled = true. Then test with:  python3 healthchecks_linux.py --dry-run
#
# Secrets: this file can hold your Organizr API key and the passwords in the
# [auth.<name>] tables. If it does, make it readable only by you, or the
# script refuses to run:  chmod 600 healthchecks.toml
# You can also keep the secrets out of the file, in environment variables.
# An environment variable that is set wins over the file:
#   HCL_ORGANIZR_TOKEN  for organizr_token
#   password_env        names the variable for each [auth.<name>] password

[general]
# The ping URL of Healthchecks. If you host Healthchecks yourself, use yours.
ping_url = "https://hc-ping.com"
# The folder of the lock files. Tronitor uses /tmp by default too.
lock_dir = "/tmp"
# Seconds to wait for each answer.
timeout = 10
# How many checks run at the same time.
workers = 8
# Send the result of each request with the ping, so that it shows in the
# check's log on Healthchecks and in its alerts.
send_details = true
# Your Organizr API key. Probes with send_token = true send it in a "token"
# header. If you do not use Organizr, leave it empty and nothing is sent.
organizr_token = ""

# Each name here can be used as {name} in a URL. Add more if you need them,
# for example a second server or a second domain.
[hosts]
domain = "domain.com"
primary = "192.168.1.103"
unraid = ""
unifi = ""
vcenter = ""
readynas = ""

# HTTP basic auth for the probes that name these tables in auth.
[auth.nagios]
user = ""
password = ""
password_env = "HCL_NAGIOS_PASSWORD"

[auth.readynas]
user = ""
password = ""
password_env = "HCL_READYNAS_PASSWORD"

# Each check has a name, the uuid of its Healthchecks check, and a list of
# probes. A probe is one GET request. The check passes when every probe
# passes, and then it pings Healthchecks with success; otherwise with fail.
#
# Probe settings:
#   url               {name} is replaced with its value from [hosts].
#   expect            The status codes that pass. Default: [200].
#   follow_redirects  Follow redirects. Default: false.
#   verify_tls        Check the HTTPS certificate. Default: true. Set it to
#                     false for a self-signed certificate on your network.
#   send_token        Send organizr_token in a "token" header. Default:
#                     false. After a redirect, it is only sent to the same host.
#   auth              The name of an [auth.<name>] table, for HTTP basic auth.
#
# The first probe is usually the reverse proxy URL and the second the
# internal address. Each setup is different: you may use a subfolder where
# this file uses a subdomain, or the opposite. Run --dry-run to see the
# status code of each probe.

[[check]]
name = "organizr"
uuid = ""
enabled = false
probes = [
  { url = "https://{domain}" },
  { url = "http://{primary}:8889" },
]

