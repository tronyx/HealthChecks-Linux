# Settings for the checks run on every push.
# Only ruff, mypy and pytest read this file; it isn't needed to use the script.

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
preview = true
extend-select = ["E"]

[tool.ruff.lint.per-file-ignores]
# Its sample Bash script copies the long curl lines of the real one.
"tests/test_migrate.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["healthchecks_linux.py", "tests"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.coverage.run]
source = ["healthchecks_linux"]
branch = true
# The script's path as it is in the repository, the same on every system, so
# the coverage measured on Linux and macOS can be combined.
relative_files = true

[tool.coverage.report]
show_missing = true
